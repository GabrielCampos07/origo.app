            $ref: '#/components/schemas/ProgressCard'
      required: [cards]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token from /api/v1/auth/login
        
        **Legal Acceptance Enforcement:**
        Protected authenticated endpoints return 403 if user is missing required legal documents.
        
        **Exempt routes (no 403):**
        - /health
        - /api/v1/auth/* (all auth routes including registration)
        - /api/v1/invites/validate (public POST endpoint, token in body)
        - /api/v1/legal/accept
        - /api/v1/legal/missing
        - /api/v1/referrals/validate (public)
        - /api/v1/webhooks/stripe (webhook)

tags:
  - name: Infrastructure
    description: Endpoints de infraestrutura (health, info)
  - name: Auth
    description: Autenticação (login, forgot-password, reset-password, registration)
  - name: Invites
    description: Bloco A Slice 1 - Student invite system (create, validate)
  - name: Legal
    description: Legal V2 acceptance tracking (privacy, terms, payments notices)
  - name: Referrals
    description: Referral MVP (codes, validation, status, payouts)
  - name: Checkout
    description: Stripe Checkout Session creation for subscriptions
  - name: HEP Professional
    description: Slice 2–3 HEP — professional roster, editor, dashboard, and clinical chart
  - name: HEP Student
    description: Slice 2–3 HEP — student program, session execution, VAS, and progress
