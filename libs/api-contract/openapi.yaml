openapi: 3.0.3
info:
  title: Origo API
  version: 0.1.0
  description: |
    API para Origo — app HEP 1:1 para fisioterapeutas/personal trainers + alunos.
    
    **Autenticação:** JWT Bearer tokens (access_token) com TTL de 15 minutos.
    Refresh tokens opacos com TTL de 7 dias.
    
    **Legal Acceptance Enforcement:** Protected authenticated endpoints return **403 Forbidden** 
    if user is missing required legal documents for their role (PROFESSIONAL vs STUDENT).
    Response: `{ error: 'legal_acceptance_required', missing_doc_versions: [...] }`
    
    **Exempt routes (no 403):** /health, /api/v1/auth/*, /api/v1/legal/accept, /api/v1/legal/missing
  
servers:
  - url: http://localhost:3001
    description: Desenvolvimento local

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [PROFESSIONAL, STUDENT]
          description: User role from User.role enum
      required:
        - id
        - email
        - role

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: mySecurePassword123
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (15 min TTL)
        refresh_token:
          type: string
          description: Opaque refresh token (7 day TTL)
        user:
          $ref: '#/components/schemas/User'
        missing_doc_versions:
          type: array
          items:
            type: string
          description: |
            Legal V2: List of required legal documents not yet accepted by user.
            Frontend should redirect to legal acceptance screens if non-empty.
            
            Login gate (all users):
            - privacy_v2_2026-09-13 → /privacidade
            - terms_app_v2_2026-09-13 → /termos
            
            Checkout gate (PROFESSIONAL role additional):
            - terms_saas_v2_2026-09-13 → /termos-saas
            - payments_notice_v2_2026-09-13 → /aviso-pagamentos
            
            STUDENT role: only base docs required (privacy + terms_app)
            
            Base URL (dev): http://localhost:3456
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
      required:
        - access_token
        - refresh_token
        - user
        - missing_doc_versions

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Se o email informado estiver cadastrado, você receberá instruções para redefinir sua senha
      required:
        - message

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Reset token from email
          example: abc123...
        new_password:
          type: string
          format: password
          minLength: 12
          description: New password (minimum 12 characters)
          example: myNewSecurePassword123
      required:
        - token
        - new_password

    ResetPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Password reset successfully
      required:
        - message

paths:
  /health:
    get:
      summary: Health check
      description: Verifica se a API está funcionando e se o banco de dados está conectado
      operationId: getHealth
      tags:
        - Infrastructure
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: connected
        '503':
          description: API com problemas (ex: DB desconectado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: disconnected
  
  /api/v1:
    get:
      summary: API v1 info
      description: Retorna informações sobre a API v1
      operationId: getApiV1Info
      tags:
        - Infrastructure
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
                  endpoints:
                    type: object

  /api/v1/auth/login:
    post:
      summary: Login
      description: |
        Autentica um usuário e retorna access token (JWT) + refresh token (opaco).
        
        **Legal V2 Integration:**
        Response includes `missing_doc_versions` array with required legal documents
        not yet accepted by the user. Frontend should redirect to legal acceptance
        screens if this array is non-empty before allowing full app access.
        
        **Rate limits:**
        - 5 requests/min por IP
        - 10 requests/hora por email (hash)
        
        **Política de segurança:**
        - Timing constante para falhas de autenticação
        - Sem enumeração de contas
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Invalid email or password
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email and password are required
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/forgot-password:
    post:
      summary: Esqueci minha senha
      description: |
        Envia email com link para redefinir senha.
        
        **IMPORTANTE:** Sempre retorna 200 com mensagem genérica,
        independente se o email existe ou não (sem enumeração de contas).
        
        **Rate limits:**
        - 3 requests/hora por email (hash)
        - 10 requests/hora por IP
        
        **Email:** Enviado via SMTP (Mailhog em dev) com link válido por 30 minutos.
      operationId: forgotPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: |
            Requisição processada (sempre retorna 200, mesmo se email não existir)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email is required
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/reset-password:
    post:
      summary: Redefinir senha
      description: |
        Redefine a senha usando o token recebido por email.
        
        **Política de segurança:**
        - Token válido por 30 minutos
        - Token de uso único (marcado como usado após sucesso)
        - Invalida TODOS os refresh tokens do usuário
        - Senha mínima: 12 caracteres
        
        **Erros:**
        - 422: senha fraca
        - 410: token expirado/usado/inválido (sempre 410, nunca 400)
      operationId: resetPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '410':
          description: Token expirado, usado ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Gone
                message: Reset token is invalid, expired, or already used
        '422':
          description: Validação falhou (senha fraca)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Password must be at least 12 characters
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/legal/accept:
    post:
      summary: Record legal document acceptances
      description: |
        Records user acceptance of one or more legal documents (privacy, terms, payments).
        
        **Required docVersions (all users - login gate):**
        - `privacy_v2_2026-09-13` → web `/privacidade` (Privacy Policy V2)
        - `terms_app_v2_2026-09-13` → web `/termos` (App Terms V2)
        
        **Additional required docVersions (PROFESSIONAL users - checkout gate):**
        - `terms_saas_v2_2026-09-13` → web `/termos-saas` (SaaS Terms V2)
        - `payments_notice_v2_2026-09-13` → web `/aviso-pagamentos` (Payments Notice V2)
        
        **Footer only (NOT login-blocking):**
        - `cookies_v2_2026-09-13` → web `/cookies` (Cookies Policy V2)
        - `dpa_subprocessors_v2_2026-09-13` → web `/dpa` (DPA Subprocessors V2)
        
        Base URL (dev): `http://localhost:3456`
        
        **Security:**
        - userId extracted from JWT (server-side, tamper-proof)
        - acceptedAt timestamp is server-controlled
        - INSERT ONLY: uses createMany with skipDuplicates: true (no upsert, no timestamp updates)
        - Re-accepting returns earliest original acceptedAt from stored records
        - Only whitelisted docVersions accepted
      operationId: recordLegalAcceptance
      tags:
        - Legal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalAcceptanceRequest'
      responses:
        '200':
          description: Acceptances recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptanceResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Valid authentication token required
        '422':
          description: Invalid docVersions or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptanceError'
              example:
                error: Validation Error
                message: Invalid docVersions provided
                invalid_versions: ["health_consent_unknown"]
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/legal/missing:
    get:
      summary: Get missing required legal documents
      description: |
        Returns which required legal documents the authenticated user has NOT yet accepted.
        
        **Use cases:**
        - Login flow: check if user needs to accept docs before full access
        - Before showing legal screens: know which docs to present
        - Checkout gate: verify PROFESSIONAL users have accepted all required docs
        
        **Role-based requirements:**
        - STUDENT users: privacy + terms_app
        - PROFESSIONAL users: privacy + terms_app + terms_saas + payments_notice
        
        **Frontend URL mappings (dev base: http://localhost:3456):**
        - `privacy_v2_2026-09-13` → `/privacidade`
        - `terms_app_v2_2026-09-13` → `/termos`
        - `terms_saas_v2_2026-09-13` → `/termos-saas`
        - `payments_notice_v2_2026-09-13` → `/aviso-pagamentos`
      operationId: getMissingLegalDocs
      tags:
        - Legal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of missing required documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalMissingDocsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/code:
    get:
      summary: Get or create referral code
      description: |
        Returns the authenticated user's referral code. Creates one if it doesn't exist.
        
        **PROFESSIONAL-only:** Only users with PROFESSIONAL role can access referral codes.
        
        **Security:**
        - userId extracted from JWT (server-side, tamper-proof)
        - One code per user (unique constraint)
        - Code format: 8 uppercase alphanumeric characters (A-Z, 2-9, excluding 0/O/1/I)
        
        **Business Rules:**
        - PROFESSIONAL users get referral codes to share
        - Referred users get 100% off first month
        - Referrer gets 15% commission on paid subscriptions after free month
      operationId: getReferralCode
      tags:
        - Referrals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Referral code retrieved or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCodeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (non-PROFESSIONAL user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only PROFESSIONAL users can access referral codes
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/status:
    get:
      summary: Get referral status and payouts
      description: |
        Returns referrals attributed to the user's referral code + payout summary.
        
        **PROFESSIONAL-only:** Only users with PROFESSIONAL role can access referral status.
        
        **Privacy:**
        - referred_user_id is returned but email/name are NOT exposed
        - Only returns data for authenticated user's referrals
        
        **Payouts:**
        - 15% commission (1500 bps) on paid subscriptions after free month
        - Zero commission during free month
        - Append-only ledger (read-only)
      operationId: getReferralStatus
      tags:
        - Referrals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Referral status and payouts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStatusResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (non-PROFESSIONAL user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only PROFESSIONAL users can access referral status
        '404':
          description: No referral code exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: No referral code exists for this user
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/validate:
    post:
      summary: Validate a referral code
      description: |
        Validates a referral code without leaking PII.
        
        **Public endpoint:** No authentication required (or can be authenticated).
        
        **Privacy:**
        - Does NOT return referrer's email, name, or other PII
        - Only returns: valid/invalid + minimal referrer hint
        - Case-insensitive code lookup
        
        **Use cases:**
        - Checkout flow: validate code before applying
        - Signup flow: check if code is valid
      operationId: validateReferralCode
      tags:
        - Referrals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateReferralCodeRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateReferralCodeResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: code is required and must be a string
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/webhooks/stripe:
    post:
      summary: Stripe webhook handler
      description: |
        Handles Stripe webhook events (invoice.paid).
        
        **Webhook-only:** Uses Stripe signature verification (NOT JWT).
        
        **Security:**
        - Stripe signature verification via STRIPE_WEBHOOK_SECRET
        - Append-only payout ledger (INSERT only, never UPDATE)
        - Idempotent: stripeInvoiceId unique constraint prevents duplicates
        
        **Business Rules:**
        - Only invoice.paid events processed
        - 15% commission (1500 bps) on paid amount after free month
        - Zero commission during free month
        - Requires Stripe Customer metadata: origo_user_id
        
        **Webhook Setup:**
        1. Create endpoint in Stripe dashboard: /api/v1/webhooks/stripe
        2. Listen to: invoice.paid
        3. Copy webhook secret to STRIPE_WEBHOOK_SECRET env var
      operationId: stripeWebhook
      tags:
        - Referrals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event payload
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  payout_id:
                    type: string
                    description: ID of payout record created (if applicable)
                  skipped:
                    type: string
                    description: Reason for skipping (if applicable)
                    enum:
                      - no_customer_or_amount
                      - customer_not_found
                      - no_origo_user_id
                      - not_referred
                      - free_month_active
                      - already_recorded
                  unhandled:
                    type: string
                    description: Event type for unhandled events
        '400':
          description: Bad request (invalid signature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: Invalid webhook signature
        '500':
          description: Internal server error (Stripe will retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LegalAcceptanceResponse:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
          description: List of docVersions that were accepted
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
        acceptedAt:
          type: string
          format: date-time
          description: Server timestamp when acceptance was recorded
      required:
        - accepted
        - acceptedAt

    LegalAcceptanceRequest:
      type: object
      properties:
        docVersions:
          type: array
          items:
            type: string
          description: List of document versions to accept
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
          minItems: 1
      required:
        - docVersions

    LegalMissingDocsResponse:
      type: object
      properties:
        missing_docs:
          type: array
          items:
            type: string
          description: List of required docVersions not yet accepted by user
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
        user_role:
          type: string
          enum: [PROFESSIONAL, STUDENT]
          description: User role (PROFESSIONAL needs extra docs for checkout)
          example: STUDENT
      required:
        - missing_docs

    LegalAcceptanceError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        invalid_versions:
          type: array
          items:
            type: string
          description: Invalid docVersions that were rejected
      required:
        - error
        - message

    LegalAcceptanceRequiredError:
      type: object
      properties:
        error:
          type: string
          enum: [legal_acceptance_required]
          description: Error code indicating missing legal acceptances
        missing_doc_versions:
          type: array
          items:
            type: string
          description: List of required docVersions not yet accepted by user
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
      required:
        - error
        - missing_doc_versions

    ReferralCodeResponse:
      type: object
      properties:
        code:
          type: string
          description: Referral code (8 uppercase alphanumeric)
          example: XYZA1234
        created_at:
          type: string
          format: date-time
          description: Code creation timestamp
      required:
        - code
        - created_at

    ReferralStatusResponse:
      type: object
      properties:
        referral_code:
          type: object
          properties:
            code:
              type: string
              example: XYZA1234
            created_at:
              type: string
              format: date-time
          required:
            - code
            - created_at
        referrals:
          type: array
          items:
            type: object
            properties:
              referred_user_id:
                type: string
                description: ID of referred user (no PII like email/name)
                example: cm123abc456
              status:
                type: string
                enum: [PENDING, ACTIVE, COMPLETED, CANCELLED]
                example: ACTIVE
              created_at:
                type: string
                format: date-time
              free_month_ends_at:
                type: string
                format: date-time
                nullable: true
            required:
              - referred_user_id
              - status
              - created_at
        payouts:
          type: array
          items:
            type: object
            properties:
              referral_id:
                type: string
                example: cm456def789
              amount_cents:
                type: integer
                description: Commission amount in cents
                example: 1500
              currency:
                type: string
                example: brl
              commission_rate_bps:
                type: integer
                description: Commission rate in basis points (1500 = 15%)
                example: 1500
              created_at:
                type: string
                format: date-time
            required:
              - referral_id
              - amount_cents
              - currency
              - commission_rate_bps
              - created_at
        total_payouts_cents:
          type: integer
          description: Sum of all payouts in cents
          example: 3000
      required:
        - referral_code
        - referrals
        - payouts
        - total_payouts_cents

    ValidateReferralCodeRequest:
      type: object
      properties:
        code:
          type: string
          description: Referral code to validate
          example: XYZA1234
          minLength: 1
          maxLength: 50
      required:
        - code

    ValidateReferralCodeResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the code is valid
          example: true
        referrer_hint:
          type: string
          description: Minimal hint about referrer (no PII)
          example: PROFESSIONAL user
      required:
        - valid

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token from /api/v1/auth/login
        
        **Legal Acceptance Enforcement:**
        Protected authenticated endpoints return 403 if user is missing required legal documents.
        
        **Exempt routes (no 403):**
        - /health
        - /api/v1/auth/* (all auth routes)
        - /api/v1/legal/accept
        - /api/v1/legal/missing
        - /api/v1/referrals/validate (public)
        - /api/v1/webhooks/stripe (webhook)

tags:
  - name: Infrastructure
    description: Endpoints de infraestrutura (health, info)
  - name: Auth
    description: Autenticação (login, forgot-password, reset-password)
  - name: Legal
    description: Legal V2 acceptance tracking (privacy, terms, payments notices)
  - name: Referrals
    description: Referral MVP (codes, validation, status, payouts)
