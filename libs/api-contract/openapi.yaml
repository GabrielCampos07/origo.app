        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/code:
    get:
      summary: Get or create referral code
      description: |
        Returns the authenticated user's referral code. Creates one if it doesn't exist.
        
        **PROFESSIONAL-only:** Only users with PROFESSIONAL role can access referral codes.
        
        **Security:**
        - userId extracted from JWT (server-side, tamper-proof)
        - One code per user (unique constraint)
        - Code format: 8 uppercase alphanumeric characters (A-Z, 2-9, excluding 0/O/1/I)
        
        **Business Rules:**
        - PROFESSIONAL users get referral codes to share
        - Referred users get 100% off first month
        - Referrer gets 15% commission on paid subscriptions after free month
      operationId: getReferralCode
      tags:
        - Referrals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Referral code retrieved or created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCodeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (non-PROFESSIONAL user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only PROFESSIONAL users can access referral codes
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/status:
    get:
      summary: Get referral status and payouts
      description: |
        Returns referrals attributed to the user's referral code + payout summary.
        
        **PROFESSIONAL-only:** Only users with PROFESSIONAL role can access referral status.
        
        **Privacy:**
        - referred_user_id is returned but email/name are NOT exposed
        - Only returns data for authenticated user's referrals
        
        **Payouts:**
        - 15% commission (1500 bps) on paid subscriptions after free month
        - Zero commission during free month
        - Append-only ledger (read-only)
      operationId: getReferralStatus
      tags:
        - Referrals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Referral status and payouts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStatusResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (non-PROFESSIONAL user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only PROFESSIONAL users can access referral status
        '404':
          description: No referral code exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: No referral code exists for this user
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/referrals/validate:
    post:
      summary: Validate a referral code
      description: |
        Validates a referral code without leaking PII.
        
        **Public endpoint:** No authentication required (or can be authenticated).
        
        **Frontend Alignment:**
        - Accepts both "code" (primary) and "referral_code" (alias) in request body
        - OpenAPI documents "code" as primary field
        - Provide either field - both are accepted for compatibility
        
        **Privacy:**
        - Does NOT return referrer's email, name, or other PII
        - Only returns: valid/invalid + minimal referrer hint
        - Case-insensitive code lookup
        
        **Use cases:**
        - Checkout flow: validate code before applying
        - Signup flow: check if code is valid
      operationId: validateReferralCode
      tags:
        - Referrals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateReferralCodeRequest'
            examples:
              using_code:
                summary: Using "code" field (primary)
                value:
                  code: XYZA1234
              using_referral_code:
                summary: Using "referral_code" field (alias)
                value:
                  referral_code: XYZA1234
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateReferralCodeResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: code is required and must be a string
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/checkout/session:
    post:
      summary: Create Stripe Checkout Session
      description: |
        Creates a Stripe Checkout Session for subscription with optional referral code.
        
        **PROFESSIONAL-only:** Only users with PROFESSIONAL role can create checkout sessions.
        
        **Security:**
        - userId extracted from JWT (server-side, tamper-proof)
        - Stripe Price IDs resolved server-side from env (client cannot manipulate)
        - referral_code validated server-side (prevents self-referral)
        - Stripe Customer metadata origo_user_id set for webhook processing
        - success/cancel URLs constructed server-side from FRONTEND_URL env
        
        **P0 TRIAL SECURITY LOCK:**
        - 14-day trial (trial_period_days: 14) ONLY via valid referral/indication code
        - Regular paid signup has NO trial_period_days (fail-closed)
        - Server-side validation prevents client from forcing trial
        - Invalid/missing referral = no trial, no discount
        
        **Business Rules:**
        - 14-day trial ONLY via valid referral/indication code (P0 SECURITY LOCK)
        - Regular paid signup has NO trial_period_days (fail-closed)
        - referral_code applies 100% off first month via Stripe coupon + 14-day trial
        - Referral attribution recorded in DB before checkout session created
        - Available plans: start, pro, clinic
        - Billing cycles: monthly, annual
        
        **Frontend Flow:**
        1. POST /api/v1/checkout/session with plan + billing_cycle + optional referral_code
        2. Receive checkout_url in response
        3. Redirect user to checkout_url (Stripe Checkout page)
        4. User completes payment on Stripe
        5. Stripe redirects to success_url with session_id
      operationId: createCheckoutSession
      tags:
        - Checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Token de autenticação válido é obrigatório
        '403':
          description: Forbidden (non-PROFESSIONAL user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Apenas usuários PROFESSIONAL podem criar sessões de checkout
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_plan:
                  summary: Invalid plan
                  value:
                    error: Validation Error
                    message: Plano inválido ou não configurado
                invalid_referral:
                  summary: Invalid referral code
                  value:
                    error: Validation Error
                    message: Código de indicação inválido
                self_referral:
                  summary: Self-referral attempt
                  value:
                    error: Validation Error
                    message: Você não pode usar seu próprio código de indicação
                already_referred:
                  summary: User already referred
                  value:
                    error: Validation Error
                    message: Você já foi indicado por outro usuário
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stripe integration not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Service Unavailable
                message: Serviço de pagamento não disponível

  /api/v1/webhooks/stripe:
    post:
      summary: Stripe webhook handler
      description: |
        Handles Stripe webhook events (invoice.paid).
        
        **Webhook-only:** Uses Stripe signature verification (NOT JWT).
        
        **Security:**
        - Stripe signature verification via STRIPE_WEBHOOK_SECRET
        - Append-only payout ledger (INSERT only, never UPDATE)
        - Idempotent: stripeInvoiceId unique constraint prevents duplicates
        
        **Business Rules:**
        - Only invoice.paid events processed
        - 15% commission (1500 bps) on paid amount after free month
        - Zero commission during free month
        - Requires Stripe Customer metadata: origo_user_id
        
        **Webhook Setup:**
        1. Create endpoint in Stripe dashboard: /api/v1/webhooks/stripe
        2. Listen to: invoice.paid
        3. Copy webhook secret to STRIPE_WEBHOOK_SECRET env var
      operationId: stripeWebhook
      tags:
        - Referrals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event payload
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  payout_id:
                    type: string
                    description: ID of payout record created (if applicable)
                  skipped:
                    type: string
                    description: Reason for skipping (if applicable)
                    enum:
                      - no_customer_or_amount
                      - customer_not_found
                      - no_origo_user_id
                      - not_referred
                      - free_month_active
                      - already_recorded
                  unhandled:
                    type: string
                    description: Event type for unhandled events
        '400':
          description: Bad request (invalid signature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: Invalid webhook signature
        '500':
          description: Internal server error (Stripe will retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

