components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LegalAcceptanceResponse:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
          description: List of docVersions that were accepted
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
        acceptedAt:
          type: string
          format: date-time
          description: Server timestamp when acceptance was recorded
      required:
        - accepted
        - acceptedAt

    LegalAcceptanceRequest:
      type: object
      properties:
        docVersions:
          type: array
          items:
            type: string
          description: List of document versions to accept
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
          minItems: 1
      required:
        - docVersions

    LegalMissingDocsResponse:
      type: object
      properties:
        missing_docs:
          type: array
          items:
            type: string
          description: List of required docVersions not yet accepted by user
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
        user_role:
          type: string
          enum: [PROFESSIONAL, STUDENT]
          description: User role (PROFESSIONAL needs extra docs for checkout)
          example: STUDENT
      required:
        - missing_docs

    LegalAcceptanceError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        invalid_versions:
          type: array
          items:
            type: string
          description: Invalid docVersions that were rejected
      required:
        - error
        - message

    LegalAcceptanceRequiredError:
      type: object
      properties:
        error:
          type: string
          enum: [legal_acceptance_required]
          description: Error code indicating missing legal acceptances
        missing_doc_versions:
          type: array
          items:
            type: string
          description: List of required docVersions not yet accepted by user
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
      required:
        - error
        - missing_doc_versions

    ReferralCodeResponse:
      type: object
      properties:
        code:
          type: string
          description: Referral code (8 uppercase alphanumeric)
          example: XYZA1234
        created_at:
          type: string
          format: date-time
          description: Code creation timestamp
      required:
        - code
        - created_at

    ReferralStatusResponse:
      type: object
      properties:
        referral_code:
          type: object
          properties:
            code:
              type: string
              example: XYZA1234
            created_at:
              type: string
              format: date-time
          required:
            - code
            - created_at
        referrals:
          type: array
          items:
            type: object
            properties:
              referred_user_id:
                type: string
                description: ID of referred user (no PII like email/name)
                example: cm123abc456
              status:
                type: string
                enum: [PENDING, ACTIVE, COMPLETED, CANCELLED]
                example: ACTIVE
              created_at:
                type: string
                format: date-time
              free_month_ends_at:
                type: string
                format: date-time
                nullable: true
            required:
              - referred_user_id
              - status
              - created_at
        payouts:
          type: array
          items:
            type: object
            properties:
              referral_id:
                type: string
                example: cm456def789
              amount_cents:
                type: integer
                description: Commission amount in cents
                example: 1500
              currency:
                type: string
                example: brl
              commission_rate_bps:
                type: integer
                description: Commission rate in basis points (1500 = 15%)
                example: 1500
              created_at:
                type: string
                format: date-time
            required:
              - referral_id
              - amount_cents
              - currency
              - commission_rate_bps
              - created_at
        total_payouts_cents:
          type: integer
          description: Sum of all payouts in cents
          example: 3000
      required:
        - referral_code
        - referrals
        - payouts
        - total_payouts_cents

    ValidateReferralCodeRequest:
      type: object
      properties:
        code:
          type: string
          description: Referral code to validate (primary field)
          example: XYZA1234
          minLength: 1
          maxLength: 50
        referral_code:
          type: string
          description: Referral code to validate (alias of "code" for frontend alignment)
          example: XYZA1234
          minLength: 1
          maxLength: 50
      required: []
      description: |
        Provide either "code" (primary) or "referral_code" (alias).
        Both fields are accepted for frontend compatibility.

    ValidateReferralCodeResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the code is valid
          example: true
        referrer_hint:
          type: string
          description: Minimal hint about referrer (no PII)
          example: PROFESSIONAL user
      required:
        - valid

    CreateCheckoutSessionRequest:
      type: object
      properties:
        plan:
          type: string
          description: Plan ID (start, pro, or clinic)
          enum: [start, pro, clinic]
          example: pro
        billing_cycle:
          type: string
          description: Billing cycle (monthly or annual)
          enum: [monthly, annual]
          example: monthly
        referral_code:
          type: string
          description: Optional referral code for 1 month free discount
          example: XYZA1234
          minLength: 1
          maxLength: 50
      required:
        - plan
        - billing_cycle

    CreateCheckoutSessionResponse:
      type: object
      properties:
        checkout_url:
          type: string
          description: Stripe Checkout Session URL to redirect user to
          example: https://checkout.stripe.com/c/pay/cs_test_...
        session_id:
          type: string
          description: Stripe Checkout Session ID
          example: cs_test_abc123...
      required:
        - checkout_url
        - session_id

    ProgramExercise:
      type: object
      properties:
        id:
          type: string
        orderIndex:
          type: integer
        name:
          type: string
        sets:
          type: integer
        reps:
          type: string
          description: Free-text prescription (e.g. "12", "8-10", "30s")
        notes:
          type: string
          nullable: true
        precautions:
          type: string
          nullable: true
      required: [id, orderIndex, name, sets, reps]

    ProgramExerciseInput:
      type: object
      properties:
        id:
          type: string
          description: Omit to create a new exercise line
        orderIndex:
          type: integer
          minimum: 0
        name:
          type: string
        sets:
          type: integer
          minimum: 1
          maximum: 50
        reps:
          type: string
        notes:
          type: string
          nullable: true
        precautions:
          type: string
          nullable: true
      required: [orderIndex, name, sets, reps]

    Program:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        phaseLabel:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE]
        targetSessionsPerWeek:
          type: integer
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ProgramExercise'
