      required: [program]

    CreateProgramRequest:
      type: object
      properties:
        title:
          type: string
        phaseLabel:
          type: string
          nullable: true
        targetSessionsPerWeek:
          type: integer
          minimum: 1
          maximum: 14
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ProgramExerciseInput'
      required: [title, targetSessionsPerWeek]

    UpdateProgramRequest:
      type: object
      properties:
        title:
          type: string
        phaseLabel:
          type: string
          nullable: true
        targetSessionsPerWeek:
          type: integer
          minimum: 1
          maximum: 14
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ProgramExerciseInput'

    BlockedExerciseDeleteError:
      type: object
      properties:
        error:
          type: string
          example: Validation Error
        message:
