openapi: 3.0.3
info:
  title: Origo API
  version: 0.1.0
  description: |
    API para Origo — app HEP 1:1 para fisioterapeutas/personal trainers + alunos.
    
    **Autenticação:** JWT Bearer tokens (access_token) com TTL de 15 minutos.
    Refresh tokens opacos com TTL de 7 dias.
    
    **Legal Acceptance Enforcement:** Protected authenticated endpoints return **403 Forbidden** 
    if user is missing required legal documents for their role (PROFESSIONAL vs STUDENT).
    Response: `{ error: 'legal_acceptance_required', missing_doc_versions: [...] }`
    
    **Exempt routes (no 403):** /health, /api/v1/auth/*, /api/v1/legal/accept, /api/v1/legal/missing
  
servers:
  - url: http://localhost:3001
    description: Desenvolvimento local

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [PROFESSIONAL, STUDENT]
          description: User role from User.role enum
      required:
        - id
        - email
        - role

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: mySecurePassword123
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (15 min TTL)
        refresh_token:
          type: string
          description: Opaque refresh token (7 day TTL)
        user:
          $ref: '#/components/schemas/User'
        missing_doc_versions:
          type: array
          items:
            type: string
          description: |
            Legal V2: List of required legal documents not yet accepted by user.
            Frontend should redirect to legal acceptance screens if non-empty.
            
            Login gate (all users):
            - privacy_v2_2026-09-13 → /privacidade
            - terms_app_v2_2026-09-13 → /termos
            
            Checkout gate (PROFESSIONAL role additional):
            - terms_saas_v2_2026-09-13 → /termos-saas
            - payments_notice_v2_2026-09-13 → /aviso-pagamentos
            
            STUDENT role: only base docs required (privacy + terms_app)
            
            Base URL (dev): http://localhost:3456
          example: ["privacy_v2_2026-09-13", "terms_app_v2_2026-09-13"]
      required:
        - access_token
        - refresh_token
        - user
        - missing_doc_versions

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Se o email informado estiver cadastrado, você receberá instruções para redefinir sua senha
      required:
        - message

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Reset token from email
          example: abc123...
        new_password:
          type: string
          format: password
          minLength: 12
          description: New password (minimum 12 characters)
          example: myNewSecurePassword123
      required:
        - token
        - new_password

    ResetPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Password reset successfully
      required:
        - message

    RegisterProfessionalRequest:
      type: object
      properties:
        name:
          type: string
          example: Dr. João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          format: password
          minLength: 12
          example: mySecurePassword123
        category:
          type: string
          enum: [FISIOTERAPIA, EDUCACAO_FISICA]
          example: FISIOTERAPIA
      required:
        - name
        - email
        - password
        - category

    RegisterStudentRequest:
      type: object
      properties:
        invite_token:
          type: string
          description: Opaque invite token from professional
          example: abc123def456...
        name:
          type: string
          example: Maria Santos
        email:
          type: string
          format: email
          description: Student email (validated, unique citext)
          example: maria@example.com
        password:
          type: string
          format: password
          minLength: 12
          example: mySecurePassword123
      required:
        - invite_token
        - name
        - email
        - password

    CreateInviteRequest:
      type: object
      description: |
        OWNER LOCK (Gabriel) - Front #37 MERGED:
        - student_email REQUIRED (validated, NOT stored - no migration)
        - Category field REMOVED (derived from ProfessionalProfile)
        Front sends ONLY student_email (no category).
      properties:
        student_email:
          type: string
          format: email
          description: Student email address (validated, NOT stored in InviteToken)
          example: maria@example.com
      required:
        - student_email

    CreateInviteResponse:
      type: object
      properties:
        invite_url:
          type: string
          description: Opaque invite token (returned once, never stored plaintext)
          example: abc123def456ghi789...
        expires_at:
          type: string
          format: date-time
          description: Token expiration timestamp (30 days from creation)
      required:
        - invite_url
        - expires_at

    ValidateInviteRequest:
      type: object
      properties:
        token:
          type: string
          description: Opaque invite token to validate (in body, NOT URL)
          example: abc123def456ghi789...
      required:
        - token

    ValidateInviteResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the invite is valid
          example: true
        state:
          type: string
          enum: [valid, expired, used, invalid]
          description: Generic invite state (no PII exposure)
          example: valid
        category:
          type: string
          enum: [FISIOTERAPIA, EDUCACAO_FISICA]
          description: Professional category (only returned for valid invites)
          example: FISIOTERAPIA
        professional_name:
          type: string
          description: Professional's name (User.name) - ONLY returned for valid invites. No email/id exposed.
          example: Dr. João Silva
      required:
        - valid
        - state

paths:
  /health:
    get:
      summary: Health check
      description: Verifica se a API está funcionando e se o banco de dados está conectado
      operationId: getHealth
      tags:
        - Infrastructure
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: connected
        '503':
          description: API com problemas (ex: DB desconectado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: disconnected
  
  /api/v1:
    get:
      summary: API v1 info
      description: Retorna informações sobre a API v1
      operationId: getApiV1Info
      tags:
        - Infrastructure
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
                  endpoints:
                    type: object

  /api/v1/auth/login:
    post:
      summary: Login
      description: |
        Autentica um usuário e retorna access token (JWT) + refresh token (opaco).
        
        **Legal V2 Integration:**
        Response includes `missing_doc_versions` array with required legal documents
        not yet accepted by the user. Frontend should redirect to legal acceptance
        screens if this array is non-empty before allowing full app access.
        
        **Rate limits:**
        - 5 requests/min por IP
        - 10 requests/hora por email (hash)
        
        **Política de segurança:**
        - Timing constante para falhas de autenticação
        - Sem enumeração de contas
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Invalid email or password
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email and password are required
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/forgot-password:
    post:
      summary: Esqueci minha senha
      description: |
        Envia email com link para redefinir senha.
        
        **IMPORTANTE:** Sempre retorna 200 com mensagem genérica,
        independente se o email existe ou não (sem enumeração de contas).
        
        **Rate limits:**
        - 3 requests/hora por email (hash)
        - 10 requests/hora por IP
        
        **Email:** Enviado via SMTP (Mailhog em dev) com link válido por 30 minutos.
      operationId: forgotPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: |
            Requisição processada (sempre retorna 200, mesmo se email não existir)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '422':
          description: Validação falhou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email is required
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/reset-password:
    post:
      summary: Redefinir senha
      description: |
        Redefine a senha usando o token recebido por email.
        
        **Política de segurança:**
        - Token válido por 30 minutos
        - Token de uso único (marcado como usado após sucesso)
        - Invalida TODOS os refresh tokens do usuário
        - Senha mínima: 12 caracteres
        
        **Erros:**
        - 422: senha fraca
        - 410: token expirado/usado/inválido (sempre 410, nunca 400)
      operationId: resetPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '410':
          description: Token expirado, usado ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Gone
                message: Reset token is invalid, expired, or already used
        '422':
          description: Validação falhou (senha fraca)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Password must be at least 12 characters
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register/professional:
    post:
      summary: Professional registration
      description: |
        Registers a new professional user and creates their profile.
        
        **Security (Bloco A Slice 1):**
        - User.role set to PROFESSIONAL server-side only (never client-supplied)
        - Creates ProfessionalProfile with validated category
        - Returns tokens like login (no separate login required)
        - Legal acceptance required before full access (403 middleware)
        
        **Product Rules:**
        - No plan gate at registration (trial starts after legal acceptance)
        - Category must be valid enum: FISIOTERAPIA | EDUCACAO_FISICA
        
        **Rate limits:**
        - 5 requests/15min per IP
      operationId: registerProfessional
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProfessionalRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation error (weak password, invalid email, email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error: Validation Error
                    message: Invalid email format
                email_exists:
                  summary: Email already registered
                  value:
                    error: Validation Error
                    message: Email already registered
                weak_password:
                  summary: Password too short
                  value:
                    error: Validation Error
                    message: Password must be at least 12 characters
                invalid_category:
                  summary: Invalid professional category
                  value:
                    error: Validation Error
                    message: Invalid professional category
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register/student:
    post:
      summary: Student registration via invite
      description: |
        Registers a new student user via valid invite token and creates enrollment.
        
        **MUST-FIX (BACKEND SECURITY):**
        - Requires real email from request body (validated + unique citext)
        - Email validated for format and uniqueness
        - No temp/generated emails (must use actual student email)
        
        **Security (Bloco A Slice 1 - 7 LOCKED REQUIREMENTS):**
        1. Token hash-only at rest, TTL, single-use (usedAt)
        2. User.role = STUDENT server-side only (never client-supplied)
        3. Generic 410/422 errors (no enumeration beyond necessary states)
        4. Creates ACTIVE Enrollment (partial unique index enforces 1 per student+category)
        5. Marks invite as used atomically
        6. Student can only register via valid invite (no open signup)
        7. professionalUserId + category derived from invite (never client-supplied)
        
        **Product Rules:**
        - Student ONLY via invite link (no free signup)
        - 1 ACTIVE enrollment per (studentUserId, category)
        - Invite carries professionalUserId + category (server-side)
        
        **Rate limits:**
        - 5 requests/15min per IP
      operationId: registerStudent
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '410':
          description: Invite invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  summary: Invalid invite
                  value:
                    error: Gone
                    message: Invalid or expired invite link
                used:
                  summary: Already used
                  value:
                    error: Gone
                    message: Invite link has already been used
                expired:
                  summary: Expired
                  value:
                    error: Gone
                    message: Invite link has expired
        '422':
          description: Validation error (weak password, duplicate enrollment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error: Validation Error
                    message: Invalid email format
                email_exists:
                  summary: Email already registered
                  value:
                    error: Validation Error
                    message: Email already registered
                weak_password:
                  summary: Password too short
                  value:
                    error: Validation Error
                    message: Password must be at least 12 characters
                duplicate_enrollment:
                  summary: Duplicate active enrollment
                  value:
                    error: Validation Error
                    message: Unable to complete registration
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/invites:
    post:
      summary: Create invite token
      description: |
        Creates an invite token for student enrollment (PROFESSIONAL only).
        
        **OWNER LOCK (Gabriel) - Front #37 MERGED:**
        - student_email REQUIRED in body (validated, NOT stored - no migration)
        - Category REMOVED from body (derived from ProfessionalProfile)
        - Front sends ONLY student_email (no category)
        
        **Email Delivery (best-effort):**
        - Invite email sent to student_email after token creation
        - Email failures do NOT fail the request (still returns 200)
        - Useful when SMTP domain is unverified or service unavailable
        - Professional can share invite link manually if email fails
        
        **Security (Bloco A Slice 1 - 7 LOCKED REQUIREMENTS):**
        1. Token hash-only at rest (SHA-256), never stores plaintext
        2. professionalUserId from JWT sub claim only (never client-supplied)
        3. Returns opaque token once (never logged, never exposed again)
        4. TTL 30 days (expiresAt)
        5. Single-use via usedAt field
        6. PROFESSIONAL-only (403 for STUDENT users)
        7. category DERIVED from ProfessionalProfile (never client-supplied)
        
        **Product Rules:**
        - Only PROFESSIONAL users can create invites
        - student_email validated (email format) but NOT stored (no InviteToken column)
        - category auto-derived from authenticated user's ProfessionalProfile.category
        - Token returned once in response (store securely on client)
        
        **Rate limits:**
        - 10 requests/15min per authenticated user
      operationId: createInvite
      tags:
        - Invites
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '200':
          description: Invite created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInviteResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (STUDENT user attempted to create invite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only PROFESSIONAL users can create invites
        '404':
          description: User or professional profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error (missing student_email, invalid email, or professional profile not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_email:
                  summary: Missing student_email
                  value:
                    error: Validation Error
                    message: student_email is required
                invalid_email:
                  summary: Invalid email format
                  value:
                    error: Validation Error
                    message: Invalid email format
                no_profile:
                  summary: Professional profile not found
                  value:
                    error: Validation Error
                    message: Professional profile not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/invites/validate:
    post:
      summary: Validate invite token
      description: |
        Validates an invite token without exposing PII (public endpoint).
        
        **SECURITY (BACKEND SECURITY P1):**
        - Token in request body (NOT URL path/query) - prevents logging in:
          · Server access logs
          · Browser history
          · Referer headers
          · Proxy logs
        - Generic states only: valid | expired | used | invalid
        - Professional name (User.name) ONLY exposed for valid invites (not expired/used/invalid)
        - No professional email or ID exposed
        - No distinction between "not found" and "invalid"
        - Returns category hint only for valid invites
        
        **Security (Bloco A Slice 1 - 7 LOCKED REQUIREMENTS):**
        1. Token hashed for lookup (SHA-256)
        2. Generic states only: valid | expired | used | invalid
        3. Minimal PII exposure: professional name (User.name) ONLY for valid invites
        4. No distinction between "not found" and "invalid"
        5. Returns category hint only for valid invites
        
        **Use cases:**
        - Frontend validates invite before showing registration form
        - Returns minimal context (category) for valid invites
        
        **Rate limits:**
        - 20 requests/min per IP (public endpoint)
      operationId: validateInvite
      tags:
        - Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateInviteRequest'
      responses:
        '200':
          description: Validation result (always 200, even for invalid tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateInviteResponse'
              examples:
                valid:
                  summary: Valid invite
                  value:
                    valid: true
                    state: valid
                    category: FISIOTERAPIA
                    professional_name: Dr. João Silva
                expired:
                  summary: Expired invite
                  value:
                    valid: false
                    state: expired
                used:
                  summary: Already used
                  value:
                    valid: false
                    state: used
                invalid:
                  summary: Invalid token
                  value:
                    valid: false
                    state: invalid
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/legal/accept:
    post:
      summary: Record legal document acceptances
      description: |
        Records user acceptance of one or more legal documents (privacy, terms, payments).
        
        **Required docVersions (all users - login gate):**
        - `privacy_v2_2026-09-13` → web `/privacidade` (Privacy Policy V2)
        - `terms_app_v2_2026-09-13` → web `/termos` (App Terms V2)
        
        **Additional required docVersions (PROFESSIONAL users - checkout gate):**
        - `terms_saas_v2_2026-09-13` → web `/termos-saas` (SaaS Terms V2)
        - `payments_notice_v2_2026-09-13` → web `/aviso-pagamentos` (Payments Notice V2)
        
        **Footer only (NOT login-blocking):**
        - `cookies_v2_2026-09-13` → web `/cookies` (Cookies Policy V2)
        - `dpa_subprocessors_v2_2026-09-13` → web `/dpa` (DPA Subprocessors V2)
        
        Base URL (dev): `http://localhost:3456`
        
        **Security:**
        - userId extracted from JWT (server-side, tamper-proof)
        - acceptedAt timestamp is server-controlled
        - INSERT ONLY: uses createMany with skipDuplicates: true (no upsert, no timestamp updates)
        - Re-accepting returns earliest original acceptedAt from stored records
        - Only whitelisted docVersions accepted
      operationId: recordLegalAcceptance
      tags:
        - Legal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalAcceptanceRequest'
      responses:
        '200':
          description: Acceptances recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptanceResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Valid authentication token required
        '422':
          description: Invalid docVersions or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalAcceptanceError'
              example:
                error: Validation Error
                message: Invalid docVersions provided
                invalid_versions: ["health_consent_unknown"]
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/legal/missing:
    get:
      summary: Get missing required legal documents
      description: |
        Returns which required legal documents the authenticated user has NOT yet accepted.
        
        **Use cases:**
        - Login flow: check if user needs to accept docs before full access
        - Before showing legal screens: know which docs to present
        - Checkout gate: verify PROFESSIONAL users have accepted all required docs
        
        **Role-based requirements:**
        - STUDENT users: privacy + terms_app
        - PROFESSIONAL users: privacy + terms_app + terms_saas + payments_notice
        
        **Frontend URL mappings (dev base: http://localhost:3456):**
        - `privacy_v2_2026-09-13` → `/privacidade`
        - `terms_app_v2_2026-09-13` → `/termos`
        - `terms_saas_v2_2026-09-13` → `/termos-saas`
        - `payments_notice_v2_2026-09-13` → `/aviso-pagamentos`
      operationId: getMissingLegalDocs
      tags:
        - Legal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of missing required documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalMissingDocsResponse'
        '401':
          description: Authentication required
          content:
