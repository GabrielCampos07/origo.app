version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: origo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: origo
      POSTGRES_PASSWORD: origo_dev_password
      POSTGRES_DB: origo_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origo"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: origo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    logging:
      driver: "none"

volumes:
  postgres_data:
    name: origo_postgres_data
